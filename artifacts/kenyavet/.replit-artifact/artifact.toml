kind = "web"
previewPath = "/"
title = "KenyaVet"
version = "1.0.0"
id = "artifacts/kenyavet"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20027

[services.development]
run = "pnpm --filter @workspace/kenyavet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kenyavet", "run", "build" ]
publicDir = "artifacts/kenyavet/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20027"
BASE_PATH = "/"
